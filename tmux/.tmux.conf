set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 200000
set-option -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# vim-like pane switching
bind -r j select-pane -L
bind -r k select-pane -D
bind -r l select-pane -U
bind -r ';' select-pane -R

bind -T copy-mode-vi j send-keys -X cursor-left
bind -T copy-mode-vi k send-keys -X cursor-down
bind -T copy-mode-vi l send-keys -X cursor-up
bind -T copy-mode-vi ';' send-keys -X cursor-right

bind-key -r j run-shell "~/.local/bin/tmux-sessionizer ~/dev/redis/Redis-Enterprise/cnm"
bind-key -r k run-shell "~/.local/bin/tmux-sessionizer ~/dev/redis/Redis-Enterprise/cnm-go"
bind-key -r l run-shell "~/.local/bin/tmux-sessionizer ~/dev/redis/Redis-Enterprise/rl-automation"
bind-key -r ';' run-shell "~/.local/bin/tmux-sessionizer ~/dev/personal/dotfiles"

# List of all plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @catppuccin_window_status_style "custom"

# The palette follows ~/.config/appearance, which `appearance light|dark|toggle`
# writes. `appearance` also reloads this config, so a running server repaints.
# Clear the plugin palette so changing flavors also works when reloading.
set -guq @thm_rosewater
set -guq @thm_flamingo
set -guq @thm_pink
set -guq @thm_red
set -guq @thm_maroon
set -guq @thm_peach
set -guq @thm_yellow
set -guq @thm_green
set -guq @thm_teal
set -guq @thm_sky
set -guq @thm_sapphire
set -guq @thm_blue
set -guq @thm_lavender
set -guq @thm_subtext_1
set -guq @thm_subtext_0
set -guq @thm_overlay_2
set -guq @thm_overlay_1
set -guq @thm_overlay_0
set -guq @thm_surface_2
set -guq @thm_mantle

if-shell 'test "$(cat ~/.config/appearance 2>/dev/null)" = light' {
    set -g @catppuccin_flavor "latte"
    set -g @thm_bg "#fafafa"
    set -g @thm_surface_0 "#e5e5e6"
    set -g @thm_surface_1 "#d7d7d9"
    set -g @thm_fg "#383a42"
    set -g @thm_mauve "#0184bc"
    set -g @thm_crust "#fafafa"
} {
    set -g @catppuccin_flavor "mocha"
    set -g @thm_bg "#282c34"
    set -g @thm_surface_0 "#313244"
    set -g @thm_surface_1 "#4b5363"
    set -g @thm_fg "#abb2bf"
    set -g @thm_mauve "#56B6C2"
    set -g @thm_crust "#282c34"
}

set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_0}]#[bg=#{@thm_surface_0},fg=#{@thm_fg}]"
set -g @catppuccin_window_middle_separator "#[fg=#{@thm_surface_0}]█"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_status_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

# Key transparency settings
set -g @catppuccin_status_background "none"

# set -g @catppuccin_window_status_style "rounded"
# set -g @catppuccin_status_background "#282c34"

set -g status-right-length 100
set -g status-left-length 130
set -g status-left "#{E:@catppuccin_status_session} "
set -g status-right "#{E:@catppuccin_status_application}"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

set-option -g status-position top
set -g status 2
set -g status-format[1] ''

run '~/.tmux/plugins/tpm/tpm'
